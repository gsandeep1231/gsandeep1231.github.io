  <title>Sandeep Gangundi | General Motors</title>
  <meta name="description" content="Digital business card for Sandeep Gangundi, Principal AI/ML Engineer — Future Sensing, Embodied AI at General Motors." />
  <style>
    :root{--gm:#0170ce;--ink:#0b1f35;--muted:#64748b;--line:#e2e8f0}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#f8fbff 0%,#eef5fb 100%);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
    .card{width:min(720px,100%);background:#fff;border:1px solid #dbe6f0;border-radius:28px;box-shadow:0 24px 70px rgba(21,52,80,.12);overflow:hidden}
    .accent{height:8px;background:var(--gm)}
    .content{padding:34px}
    .brand{display:flex;align-items:center;margin-bottom:36px}
    .brand img{display:block;width:96px;height:96px;object-fit:contain;max-width:28vw}
    h1{font-size:clamp(36px,7vw,58px);line-height:1.02;margin:0 0 16px;letter-spacing:-.035em}
    .role{font-size:clamp(21px,4vw,28px);margin:0 0 6px;font-weight:550}
    .team{color:var(--muted);font-size:clamp(18px,3.5vw,23px);margin:0}
    .divider{height:1px;background:var(--line);margin:30px 0}
    .email{display:inline-block;color:var(--gm);font-size:18px;text-decoration:none;overflow-wrap:anywhere;margin-bottom:24px}
    .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:14px;text-decoration:none;font-weight:700;font-size:15px;padding:0 14px;border:1px solid var(--line);color:var(--ink);background:#fff}
    .btn.primary{background:var(--gm);border-color:var(--gm);color:#fff}
    .footer{padding:0 34px 28px;color:#94a3b8;font-size:13px;text-align:center}
    @media(max-width:560px){body{padding:14px}.content{padding:26px}.brand{margin-bottom:28px}.brand img{width:82px;height:82px;max-width:32vw}.actions{grid-template-columns:1fr}.footer{padding:0 26px 24px}}
  </style>
