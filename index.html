<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Sandeep Gangundi | General Motors</title>
  <meta name="description" content="Digital business card for Sandeep Gangundi, Principal AI/ML Engineer — Future Sensing, Embodied AI at General Motors." />
  <style>
    :root{--gm:#0170ce;--ink:#0b1f35;--muted:#64748b;--line:#e2e8f0}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#f8fbff 0%,#eef5fb 100%);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
    .card{width:min(720px,100%);background:#fff;border:1px solid #dbe6f0;border-radius:28px;box-shadow:0 24px 70px rgba(21,52,80,.12);overflow:hidden}
    .accent{height:8px;background:var(--gm)}
    .content{padding:34px}
    .brand{display:flex;align-items:center;gap:16px;margin-bottom:36px}
    .gm-logo{width:66px;height:66px;border:5px solid var(--gm);border-radius:16px;display:grid;place-items:center;color:var(--gm);font-weight:800;font-size:38px;line-height:1;letter-spacing:-3px;position:relative}
    .gm-logo::after{content:"";position:absolute;width:24px;height:4px;background:var(--gm);bottom:12px;right:10px;border-radius:3px}
    .brand-name{color:var(--gm);font-size:28px;letter-spacing:.08em;text-transform:lowercase;font-weight:650}
    h1{font-size:clamp(36px,7vw,58px);line-height:1.02;margin:0 0 16px;letter-spacing:-.035em}
    .role{font-size:clamp(21px,4vw,28px);margin:0 0 6px;font-weight:550}
    .team{color:var(--muted);font-size:clamp(18px,3.5vw,23px);margin:0}
    .divider{height:1px;background:var(--line);margin:30px 0}
    .email{display:inline-block;color:var(--gm);font-size:18px;text-decoration:none;overflow-wrap:anywhere;margin-bottom:24px}
    .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:14px;text-decoration:none;font-weight:700;font-size:15px;padding:0 14px;border:1px solid var(--line);color:var(--ink);background:#fff}
    .btn.primary{background:var(--gm);border-color:var(--gm);color:#fff}
    .footer{padding:0 34px 28px;color:#94a3b8;font-size:13px;text-align:center}
    @media(max-width:560px){body{padding:14px}.content{padding:26px}.brand{margin-bottom:28px}.brand-name{font-size:21px;letter-spacing:.06em}.gm-logo{width:58px;height:58px;font-size:33px}.actions{grid-template-columns:1fr}.footer{padding:0 26px 24px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="accent"></div>
    <section class="content">
      <div class="brand" aria-label="General Motors">
        <div class="gm-logo" aria-hidden="true">gm</div>
        <div class="brand-name">general motors</div>
      </div>
      <h1>Sandeep Gangundi</h1>
      <p class="role">Principal AI/ML Engineer</p>
      <p class="team">Future Sensing, Embodied AI</p>
      <div class="divider"></div>
      <a class="email" href="mailto:sandeep.1.gangundi@gm.com">sandeep.1.gangundi@gm.com</a>
      <div class="actions">
        <a class="btn primary" href="mailto:sandeep.1.gangundi@gm.com">Email me</a>
        <a class="btn" href="https://www.linkedin.com/in/sandeepgangundi" target="_blank" rel="noopener">LinkedIn</a>
        <a class="btn" id="save-contact" href="#">Save contact</a>
      </div>
    </section>
    <div class="footer">General Motors · Digital business card</div>
  </main>
  <script>
    document.getElementById('save-contact').addEventListener('click', function(e){
      e.preventDefault();
      const vcard=['BEGIN:VCARD','VERSION:3.0','FN:Sandeep Gangundi','N:Gangundi;Sandeep;;;','ORG:General Motors','TITLE:Principal AI/ML Engineer - Future Sensing, Embodied AI','EMAIL;TYPE=WORK:sandeep.1.gangundi@gm.com','URL:https://www.linkedin.com/in/sandeepgangundi','END:VCARD'].join('\n');
      const blob=new Blob([vcard],{type:'text/vcard'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;a.download='Sandeep-Gangundi.vcf';
      document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
